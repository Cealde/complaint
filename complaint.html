<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>complaint Complaint Simulator</title>
  <link rel="stylesheet" href="topbar.css">
  <link rel="stylesheet" href="complaint.css">
  <link rel="icon" type="image/png" href="assets/logo.png">
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="index.html" class="logo">
        <img src="assets/logo.png" id="logo" alt="complaint Logo">
        <span class="logo-text">Unicomplaint Complaint Portal</span>
      </a>
      <nav class="nav-links">
        <a href="#" class="nav-link">My Complaints</a>
        <a href="#" class="nav-link">FAC</a>
        <a href="#" class="nav-link">About Us</a>
        <a href="#" class="nav-link">Contact Us</a>
      </nav>
    </div>
  </header>


  <main>

    <h1 class="title">Select your Complaint Type</h1>

    <div class="complaint-list">
        <button class="complaint-button">
          <div class="complaint-image-frame">
            <img src="assets/complaints/flavus.png" alt="Flavus" class="complaint-button-image"/>
          </div>
          <span class="complaint-button-text">Flavus complaint</span>
        </button>
        <button class="complaint-button">
          <div class="complaint-image-frame">
            <img src="assets/complaints/daphne.png" alt="daphne" class="complaint-button-image"/>
          </div>
          <span class="complaint-button-text">Daphne complaint</span>
        </button>
    </div>
    

  </main>

  <script src="script.js"></script>

</body>
</html>
