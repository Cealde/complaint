<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hostel Complaint</title>
  <link rel="stylesheet" href="topbar.css">
  <link rel="stylesheet" href="complaint.css">
  <link rel="icon" type="image/png" href="assets/logo.png">
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="index.html" class="logo">
        <img src="assets/logo.png" id="logo" alt="complaint Logo">
        <span class="logo-text">UniHostel Complaint Portal</span>
      </a>
      <nav class="nav-links">
        <a href="mylist.html" class="nav-link">My Complaints</a>
        <a href="#" class="nav-link">Info</a>
        <a href="#" class="nav-link">About Us</a>
        <a href="#" class="nav-link">Contact Us</a>
      </nav>
    </div>
  </header>


  <main>

    <div class="header-container">
        <button class="back-button" onclick="history.back()">↞</button>
        <h1 class="title">Complaint Form</h1>
    </div>

    <hr>

    <h1 style="text-align:left" class="title">Select your Complaint Type</h1>

    <div class="complaint-list">
        <button class="complaint-button">
          <div class="complaint-image-frame">
            <img src="assets/complaints/droplets.svg" alt="water" class="complaint-button-image"/>
          </div>
          <span class="complaint-button-text">Water Issue</span>
        </button>
        <button class="complaint-button">
          <div class="complaint-image-frame">
            <img src="assets/complaints/plug-zap.svg" alt="electrical" class="complaint-button-image"/>
          </div>
          <span class="complaint-button-text">Electrical Appliance Issue</span>
        </button>
        <button class="complaint-button">
          <div class="complaint-image-frame">
            <img src="assets/complaints/zap.svg" alt="electricity" class="complaint-button-image"/>
          </div>
          <span class="complaint-button-text">Electricity Wiring Issue</span>
        </button>
        <button class="complaint-button">
          <div class="complaint-image-frame">
            <img src="assets/complaints/paintbrush-vertical.svg" alt="paint" class="complaint-button-image"/>
          </div>
          <span class="complaint-button-text">Paint Issue</span>
        </button>
        <button class="complaint-button">
          <div class="complaint-image-frame">
            <img src="assets/complaints/mirror-round.svg" alt="mirror" class="complaint-button-image"/>
          </div>
          <span class="complaint-button-text">Missing/Broken Itenerary</span>
        </button>
        <button class="complaint-button">
          <div class="complaint-image-frame">
            <img src="assets/complaints/door-open.svg" alt="door" class="complaint-button-image"/>
          </div>
          <span class="complaint-button-text">Door/Window Issue</span>
        </button>
        <button class="complaint-button">
          <div class="complaint-image-frame">
            <img src="assets/complaints/toilet.svg" alt="toilet" class="complaint-button-image"/>
          </div>
          <span class="complaint-button-text">Bathroom Issue</span>
        </button>
        <button class="complaint-button">
          <div class="complaint-image-frame">
            <img src="assets/complaints/brick-wall.svg" alt="wall" class="complaint-button-image"/>
          </div>
          <span class="complaint-button-text">Structural Issue</span>
        </button>
        <button class="complaint-button">
          <div class="complaint-image-frame">
            <img src="assets/complaints/bed-single.svg" alt="bed" class="complaint-button-image"/>
          </div>
          <span class="complaint-button-text">Bed/Mattress Issue</span>
        </button>
        <button class="complaint-button">
          <div class="complaint-image-frame">
            <img src="assets/complaints/boxes.svg" alt="box" class="complaint-button-image"/>
          </div>
          <span class="complaint-button-text">Other</span>
        </button>
    </div>

    <div id="specify-issue-section" style="display: none;">
        <hr>
        <h1 style="text-align:left" class="title">Specify Issue</h1>
        <div class="specify-container complaint-list" id="sub-issue-list">
        </div>
    </div>

    <hr>

    <div class="text-area-container">
        <label for="additional" class="title">Information</label><br>
        <textarea id="additional" name="additional" rows="4" cols="50" placeholder="Enter here..."></textarea>
    </div>

    <hr>

    <div class="input-row-container">
        <div class="input-group">
            <label for="room-number" class="title">Room Number</label>
            <input type="text" id="room-number" name="room-number" placeholder="Room Number" required>
        </div>
        <div class="input-group align-right">
            <label for="name" class="title">Name</label>
            <input type="text" id="name" name="name" placeholder="Name" required>
        </div>
    </div>

    <div class="input-row-container">
        <div class="input-group">
            <label for="phone-number" class="title">Mobile Number</label>
            <input type="mob" id="phone-number" name="phone-number" placeholder="Phone Number" required>
        </div>
        <div class="input-group align-right">
            <label for="name" class="title">Email Address</label>
            <input type="email" id="email" name="email" placeholder="Email" required>
        </div>
    </div>

    <hr>

    <input type="submit" class="submit-btn">

  </main>

  <script src="complaint.js"></script>

</body>
</html>
