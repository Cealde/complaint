<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniHostel Complaint Portal</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/topbar.css">
  <link rel="icon" type="image/png" href="../assets/logo.png">
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="/" class="logo">
        <img src="../assets/logo.png" id="logo" alt="Hostel Logo">
        <span class="logo-text">UniHostel Complaint Portal</span>
      </a>
      <nav class="nav-links">
        <a href="/mylist" class="nav-link">My Complaints</a>
        <a href="/info" class="nav-link">Info</a>
        <a href="/about" class="nav-link">About Us</a>
        <a href="/contact" class="nav-link">Contact Us</a>
      </nav>
    </div>
  </header>


  <main>
    <h2 class="title" id="name-title" style="font-size: 2.5vw"></h2>
    <hr style="border:1px solid #562f00">
    <h1 class="title">Select your Hostel</h1>

    <div class="hostel-container">
        <div class="hostel-buttons-grid">
        <button class="hostel-button">
          <div class="hostel-image-frame">
            <img src="../assets/hostels/flavus.png" alt="Flavus" class="hostel-button-image" />
          </div>
          <span class="hostel-button-text">Flavus Hostel</span>
        </button>
        <button class="hostel-button">
          <div class="hostel-image-frame">
            <img src="../assets/hostels/daphne.png" alt="daphne" class="hostel-button-image" />
          </div>
          <span class="hostel-button-text">Daphne Hostel</span>
        </button>
        <button class="hostel-button">
          <div class="hostel-image-frame">
            <img src="../assets/hostels/hecate.png" alt="hecate" class="hostel-button-image" />
          </div>
          <span class="hostel-button-text">Hecate Hostel</span>
        </button>
        <button class="hostel-button">
          <div class="hostel-image-frame">
            <img src="../assets/hostels/lares.png" alt="lares" class="hostel-button-image" />
          </div>
          <span class="hostel-button-text">Lares Hostel</span>
        </button>
        <button class="hostel-button">
          <div class="hostel-image-frame">
            <img src="../assets/hostels/oreads.png" alt="oreads" class="hostel-button-image" />
          </div>
          <span class="hostel-button-text">Oreads Hostel</span>
        </button>
        <button class="hostel-button">
          <div class="hostel-image-frame">
            <img src="../assets/hostels/medea.png" alt="medea" class="hostel-button-image" />
          </div>
          <span class="hostel-button-text">Medea Hostel</span>
        </button>
        <button class="hostel-button">
          <div class="hostel-image-frame">
            <img src="../assets/hostels/istra.png" alt="istra" class="hostel-button-image" />
          </div>
          <span class="hostel-button-text">Istra Hostel</span>
        </button>
        <button class="hostel-button">
          <div class="hostel-image-frame">
            <img src="../assets/hostels/creon.png" alt="creon" class="hostel-button-image" />
          </div>
          <span class="hostel-button-text">Creon Hostel</span>
        </button>
      </div>
    </div>

    <div class="select-button-container" id="select-button-container">
      <button class="btn" id="select-hostel-button" disabled><span style="transform: translateY(-4px)">Select Hostel</span></button>
    </div>


  </main>

  <script src="../js/script.js"></script>

</body>
</html>
