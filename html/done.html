<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complaint Sent - UniHostel Portal</title>
  <link rel="stylesheet" href="../css/topbar.css">
  <link rel="stylesheet" href="../css/done.css">
  <link rel="icon" type="image/png" href="../assets/logo.png">
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="/" class="logo">
        <img src="../assets/logo.png" id="logo" alt="Hostel Logo">
        <span class="logo-text">UniHostel Complaint Portal</span>
      </a>
      <nav class="nav-links">
        <a href="/mylist" class="nav-link">My Complaints</a>
        <a href="/info" class="nav-link">Info</a>
        <a href="/about" class="nav-link">About Us</a>
        <a href="/contact" class="nav-link">Contact Us</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="success-box">
        <img src="../assets/complaints/circle-check-big.svg" class="success-icon">
        <h1 class="success-title">Complaint Sent</h1>
        <p class="success-subtitle">Your complaint has been successfully recorded.</p>
        <hr>

        <div class="receipt-details">
            <div class="receipt-row">
                <span class="receipt-label">Hostel:</span>
                <span class="receipt-value" id="res-hostel">-</span>
            </div>
            <div class="receipt-row">
                <span class="receipt-label">Room Number:</span>
                <span class="receipt-value" id="res-room">-</span>
            </div>
            <div class="receipt-row">
                <span class="receipt-label">Student Name:</span>
                <span class="receipt-value" id="res-name">-</span>
            </div>
            <div class="receipt-row">
                <span class="receipt-label">Complaint Type:</span>
                <span class="receipt-value" id="res-type">-</span>
            </div>
            <div class="receipt-row">
                <span class="receipt-label">Specific Complaints:</span>
                <span class="receipt-value" id="res-spec">-</span>
            </div>
            <div class="receipt-row">
                <span class="receipt-label">Severity:</span>
                <span class="receipt-value" id="res-priority">-</span>
            </div>
            <div class="receipt-row" id="info-row" style="display: none;">
                <span class="receipt-label">Additional Info:</span>
                <span class="receipt-value" id="res-info">-</span>
            </div>
        </div>

        <button class="home-btn" onclick="location.href='/mylist'">Go to Your Complaints</button>
    </div>
  </main>

  <script src="../js/done.js"></script>

</body>
</html>
