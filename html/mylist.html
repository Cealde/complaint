<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hostel Complaint Simulator</title>
  <link rel="stylesheet" href="../css/mylist.css">
  <link rel="stylesheet" href="../css/topbar.css">
  <link rel="icon" type="image/png" href="../assets/logo.png">
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="/" class="logo">
        <img src="../assets/logo.png" id="logo" alt="Hostel Logo">
        <span class="logo-text">UniHostel Complaint Portal</span>
      </a>
      <nav class="nav-links">
        <a href="/mylist" class="nav-link">My Complaints</a>
        <a href="/info" class="nav-link">Info</a>
        <a href="/about" class="nav-link">About Us</a>
        <a href="/contact" class="nav-link">Contact Us</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="header-container">
        <button class="back-button" onclick="location.href='/'">↞</button>
        <h1 class="title">My Complaints</h1>
    </div>

    <div class="table-container">
        <table class="complaints-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Hostel</th>
                    <th>Room No</th>
                    <th>Category</th>
                    <th>Specific Issue</th>
                    <th>Status</th>
                    <th>Date</th>
                    <th>Severity</th>
                </tr>
            </thead>
            <tbody id="complaints-body">
            </tbody>
        </table>
    </div>

  </main>

  <script src="../js/mylist.js"></script>

</body>
</html>
