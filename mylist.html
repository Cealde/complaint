<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hostel Complaint Simulator</title>
  <link rel="stylesheet" href="mylist.css">
  <link rel="stylesheet" href="topbar.css">
  <link rel="icon" type="image/png" href="assets/logo.png">
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="index.html" class="logo">
        <img src="assets/logo.png" id="logo" alt="Hostel Logo">
        <span class="logo-text">UniHostel Complaint Portal</span>
      </a>
      <nav class="nav-links">
        <a href="mylist.html" class="nav-link">My Complaints</a>
        <a href="info.html" class="nav-link">Info</a>
        <a href="about.html" class="nav-link">About Us</a>
        <a href="contact.html" class="nav-link">Contact Us</a>
      </nav>
    </div>
  </header>


  <main>
    <div class="header-container">
        <button class="back-button" onclick="location.href='index.html'">↞</button>
        <h1 class="title">My Complaints</h1>
    </div>

    <div class="table-container">
        <table class="complaints-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Category</th>
                    <th>Specific Issue</th>
                    <th>Status</th>
                    <th>Date</th>
                </tr>
            </thead>
        </table>
    </div>




    
  </main>

  <script src="script.js"></script>

</html>
